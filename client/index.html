    <!-- Google AdSense Tag (Chargement dynamique ou balise standard) -->
    <script>
      (function() {
        // Tente de récupérer l'identifiant client configuré en base s'il existe

          .then(function(r) { return r.json(); })
          .then(function(res) {
            var client = (res && res.adsense && res.adsense.client) || '';
            if (client && client.indexOf('ca-pub-') === 0) {
              var s = document.createElement('script');
              s.async = true;
              s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + encodeURIComponent(client);
              s.crossOrigin = 'anonymous';
              document.head.appendChild(s);
            }
          })
          .catch(function() {});
