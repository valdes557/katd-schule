# ---------------------------------------------------------------------------
# Déploiement automatique KATD-SCHÜLE sur l'hébergement cPanel (gptservers.cloud)
#
# Le site est hébergé sur un cPanel mutualisé (domaine katdschool.com), avec une
# application Node.js gérée par cPanel (« Setup Node.js App » / Passenger). Il n'y a
# ni SSH root, ni PM2, ni Nginx : le déploiement se fait par FTP(S).
#
# À chaque push sur `main` :
#   1. Le client React/Vite est COMPILÉ sur le runner GitHub (beaucoup de RAM).
#   2. Les dépendances backend de PRODUCTION sont installées sur le runner
#      (paquets 100 % JavaScript → compatibles avec le Linux de l'hébergeur).
#   3. Le tout (server/ + server/node_modules + client/dist) est synchronisé par
#      FTPS vers le dossier de l'application Node (envoi incrémental : seuls les
#      fichiers modifiés partent → mises à jour quasi instantanées).
#   4. On (ré)écrit `tmp/restart.txt` → Passenger redémarre l'app Node : le site en
#      ligne reflète alors le dernier commit.
#
# Secrets requis (Settings ▸ Secrets and variables ▸ Actions) :
#   FTP_HOST      -> hôte FTP de l'hébergement (ex. ftp.katdschool.com)
#   FTP_USERNAME  -> identifiant du compte FTP cPanel
#   FTP_PASSWORD  -> mot de passe du compte FTP cPanel
#   FTP_APP_DIR   -> (optionnel) dossier racine de l'app Node sur l'hébergement,
#                    ex. "/katd-schule/" ou "/home/USER/katd-schule/". Défaut : "./"
#
# ⚠️ Le fichier server/.env (secrets : MONGO_URI, JWT_SECRET, clés…) vit UNIQUEMENT
#    sur l'hébergement et n'est JAMAIS écrasé (exclu de la synchro ci-dessous).
#    De même, server/uploads/ (fichiers téléversés) est préservé.
# Voir AUTO-DEPLOY.md pour la mise en place détaillée côté cPanel.
# ---------------------------------------------------------------------------
name: Deploy to cPanel (gptservers.cloud)

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permet aussi de lancer le déploiement à la main

permissions:
  contents: read

# Un seul déploiement à la fois ; annule celui en cours si un nouveau push arrive.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build (CI) + déploiement FTP
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build du client React/Vite (sur le runner GitHub)
        working-directory: client
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm install --no-audit --no-fund
          npx vite build
          test -f dist/index.html || (echo "Build client échoué : dist/index.html manquant" && exit 1)

      - name: Dépendances backend (production, 100 % JS → portables vers cPanel)
        working-directory: server
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Génération du déclencheur de redémarrage Passenger
        run: |
          mkdir -p tmp
          echo "restart ${GITHUB_SHA} $(date -u +%FT%TZ)" > tmp/restart.txt

      # L'action FTP exige que server-dir se termine par « / ». On normalise ici
      # le secret FTP_APP_DIR (ajout d'un « / » final s'il manque ; « ./ » par défaut)
      # pour qu'un secret mal formé ne fasse plus échouer le déploiement.
      - name: Normalisation du dossier cible FTP (garantit un « / » final)
        id: ftp_target
        env:
          RAW_DIR: ${{ secrets.FTP_APP_DIR }}
        run: |
          DIR="${RAW_DIR:-./}"
          DIR="${DIR%/}/"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Dossier cible FTP normalisé : $DIR"

      - name: Déploiement FTPS (synchro incrémentale)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ steps.ftp_target.outputs.dir }}
          # On NE nettoie PAS le serveur (préserve .env, uploads/ côté hôte).
          dangerous-clean-slate: false
          # Exclusions : ce qui ne doit pas partir (ou ne doit jamais écraser l'hébergement).
          # NB : server/node_modules N'EST PAS exclu → les dépendances de prod partent
          #      avec l'app (aucune commande npm à lancer manuellement sur l'hébergement).
          exclude: |
            **/.git*
            **/.git*/**
            client/node_modules/**
            server/.env
            server/.env.*
            server/uploads/**
            server/logs/**
            **/.DS_Store
            .github/**
            backups/**
            *.md
            ecosystem.config.js
            deploy.sh
            nginx-katdschool.conf
